# Monitoreo de PRODUCCION.
#
# POR QUE EXISTE: el 2026-08-12 el archivado de WAL estuvo roto 45 minutos
# acumulando 102 fallos y NADA aviso; se detecto mirando a mano. Con el ERP
# desplegado eso significa creer que hay recuperacion a punto en el tiempo
# cuando no la hay.
#
# ARQUITECTURA: produccion NO evalua alertas ni guarda series. Corre un
# Prometheus en modo AGENTE (~200 MB, sin consultas ni almacenamiento) que envia
# las metricas por la malla Tailscale al Prometheus de nonprod, donde ya viven
# las reglas, Grafana y Alertmanager. Es lo que se definio al principio:
# observabilidad en otra maquina, no compitiendo por recursos con la produccion.
#
# hostAliases y no MagicDNS: `tailscale serve` exige SNI con el nombre de la
# tailnet, y ese nombre no resuelve en el nodo (CorpDNS=false). Activar MagicDNS
# reescribiria el /etc/resolv.conf del nodo, del que depende CoreDNS para TODOS
# los pods del ERP. Cambiar la resolucion de nombres de un nodo de produccion
# para habilitar monitoreo es desproporcionado; el alias afecta a un solo pod.
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# ─────────────────────────── kube-state-metrics ───────────────────────────
# Traduce el estado de los objetos de Kubernetes a metricas. Es la unica fuente
# para saber si un Job de respaldo FALLO: sin esto no hay senal del CronJob de
# MongoDB.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  # Solo lectura, y solo de lo que se necesita para vigilar respaldos y cargas.
  - apiGroups: [""]
    resources: [pods, nodes, services, persistentvolumeclaims, namespaces]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list, watch]
  # Los respaldos de PostgreSQL son un recurso propio de CloudNativePG. Hace
  # falta leerlos porque CNPG NO puebla .status.lastSuccessfulBackup cuando el
  # respaldo se hace por plugin: la metrica
  # cnpg_collector_last_available_backup_timestamp queda en 0 para siempre
  # (verificado). Una alerta sobre esa metrica dispararia siempre, y una que la
  # ignore no detectaria nunca un respaldo que dejo de correr.
  - apiGroups: [postgresql.cnpg.io]
    resources: [backups, clusters]
    verbs: [list, watch]
  # Sin esto lo anterior NO SIRVE: kube-state-metrics descubre los recursos
  # personalizados leyendo primero las definiciones (CRD). Al faltar el permiso
  # registra "customresourcedefinitions is forbidden" en bucle, ignora la
  # configuracion... y queda Ready igual, sirviendo el resto de las metricas.
  # El fallo solo se ve en los logs.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kube-state-metrics }
subjects:
  - { kind: ServiceAccount, name: kube-state-metrics, namespace: monitoring }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-state-metrics-respaldos
  namespace: monitoring
data:
  # Expone los recursos Backup de CloudNativePG como metricas. Es la unica
  # fuente fiable de "cuando fue el ultimo respaldo bueno" con el metodo por
  # plugin: el estado del Cluster no trae ese dato.
  respaldos.yaml: |
    kind: CustomResourceStateMetrics
    spec:
      resources:
        - groupVersionKind:
            group: postgresql.cnpg.io
            version: v1
            kind: Backup
          metricNamePrefix: erp_respaldo_pg
          labelsFromPath:
            nombre:    [metadata, name]
            namespace: [metadata, namespace]
            cluster:   [spec, cluster, name]
          metrics:
            - name: fin_timestamp
              help: "Momento en que termino el respaldo, en segundos desde epoch"
              each:
                type: Gauge
                gauge:
                  path: [status, stoppedAt]
                  # KSM convierte solo las fechas RFC3339 a timestamp.
                  nilIsZero: true
            - name: fase
              help: "Fase del respaldo (completed, failed, running)"
              each:
                type: Info
                info:
                  labelsFromPath:
                    fase: [status, phase]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
  labels: { app.kubernetes.io/name: kube-state-metrics }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: kube-state-metrics } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kube-state-metrics }
      annotations:
        configuracion/version: "2"
    spec:
      serviceAccountName: kube-state-metrics
      securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.17.0
          args:
            - --resources=pods,nodes,deployments,statefulsets,jobs,cronjobs,persistentvolumeclaims
            - --custom-resource-state-config-file=/configuracion/respaldos.yaml
            # Sin esto, activar el modo de recursos personalizados DESACTIVA los
            # recursos estandar y se perderian las metricas de Jobs.
            - --custom-resource-state-only=false
          volumeMounts:
            - { name: configuracion, mountPath: /configuracion }
          # DOS puertos, y no es un detalle: kube-state-metrics sirve /metrics en
          # el 8080 pero /readyz y /healthz en el 8081 (telemetria). Apuntar la
          # sonda al 8080 devuelve 404 y el pod nunca queda listo, aunque el
          # proceso este perfectamente sano.
          ports:
            - { name: http, containerPort: 8080 }
            - { name: telemetria, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /readyz, port: telemetria }
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: telemetria }
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: configuracion
          configMap: { name: kube-state-metrics-respaldos }
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  selector: { app.kubernetes.io/name: kube-state-metrics }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
# ─────────────────────────── Prometheus (agente) ───────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-agente
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-agente
rules:
  - apiGroups: [""]
    resources: [nodes, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: ["/metrics"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-agente
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus-agente }
subjects:
  - { kind: ServiceAccount, name: prometheus-agente, namespace: monitoring }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-agente
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s
      # external_labels distingue estas series de las de DEV y QA en el
      # Prometheus comun. Sin esto, una alerta de respaldo no diria de que
      # ambiente viene, que es lo unico que importa a las 3 de la manana.
      external_labels:
        ambiente: pdn
        origen: erp-pdn

    scrape_configs:
      # CloudNativePG expone cnpg_* en el puerto 9187 de cada instancia: de ahi
      # salen el estado del archivado de WAL y la antiguedad del ultimo respaldo.
      - job_name: postgresql
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [erp-pdn] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            regex: .+
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "9187"
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            target_label: cluster
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc.cluster.local:8080"]

      # El propio agente: si deja de reportarse, es que se cayo.
      - job_name: agente
        static_configs:
          - targets: ["localhost:9090"]

    remote_write:
      - url: https://erp-nonprod.tail72aebc.ts.net:9090/api/v1/write
        # La malla ya cifra y autentica; el TLS de tailscale serve valida con
        # certificado real (verificado: tls=0 sin omitir validacion).
        queue_config:
          # Con el enlace caido, retiene hasta 2 h de metricas y las envia al
          # reconectar, en vez de perderlas.
          capacity: 10000
          max_shards: 3
          max_samples_per_send: 1000
          batch_send_deadline: 10s
          min_backoff: 100ms
          max_backoff: 30s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-agente
  namespace: monitoring
  labels: { app.kubernetes.io/name: prometheus-agente }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: prometheus-agente } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus-agente }
      annotations:
        # Fuerza el reinicio del pod cuando cambia la configuracion.
        configuracion/version: "1"
    spec:
      serviceAccountName: prometheus-agente
      # Sin esto el agente no puede resolver el destino: ver la nota de arriba.
      hostAliases:
        - ip: 100.94.218.42
          hostnames: ["erp-nonprod.tail72aebc.ts.net"]
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.6.0
          args:
            # --agent: sin consultas, sin almacenamiento a largo plazo, solo
            # recolectar y reenviar. Es lo que lo vuelve barato en produccion.
            - --agent
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.agent.path=/datos
            - --web.listen-address=:9090
            - --web.enable-lifecycle
          ports: [{ name: http, containerPort: 9090 }]
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - { name: configuracion, mountPath: /etc/prometheus }
            - { name: datos, mountPath: /datos }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: configuracion
          configMap: { name: prometheus-agente }
        # El buffer del agente es efimero a proposito: si el pod muere se
        # pierden como mucho unos minutos de metricas, y a cambio no consume
        # disco persistente en un nodo unico.
        - name: datos
          emptyDir: { sizeLimit: 2Gi }
