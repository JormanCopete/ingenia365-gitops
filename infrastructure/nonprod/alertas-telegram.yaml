# Adonde van las alertas y como se escriben (Telegram «IngenIA365 Alertas»).
#
# Hay UN solo Alertmanager para los tres ambientes: vive en nonprod, y produccion
# le manda sus metricas por el agente de infrastructure/pdn/monitoreo.yaml. Este
# archivo decide que llega al chat y con que forma, para DEV, QA y PDN a la vez.
#
# LOS TEXTOS NO ESTAN AQUI: cada regla trae los suyos en sus anotaciones
# (titulo, que_pasa, que_hacer) en alertas-explicadas.yaml y alertas-backup.yaml,
# que son lo mismo que muestra Grafana. Aqui solo esta la forma del mensaje.
#
# Llega a Telegram SOLO lo que lleva la etiqueta origen=ingenia365 (las reglas de
# esos dos archivos); las reglas de fabrica de kube-prometheus-stack se evaluan y se
# ven en Grafana, pero no avisan. Para que una avise, se copia al catalogo con sus
# textos.
#
# NO lo sincroniza Argo: el chat no puede ir en el repo (es PUBLICO) y este objeto
# no admite leerlo de un Secret. El token esta en el Secret telegram-alertas; el
# chat se toma del objeto vivo al aplicar:
#
#   chat=$(kubectl -n monitoring get alertmanagerconfig alertas-ingenia365 \
#            -o jsonpath='{.spec.receivers[?(@.name=="telegram")].telegramConfigs[0].chatID}')
#   sed "s/chatID: 0 #/chatID: $chat #/" alertas-telegram.yaml | kubectl apply -f -
#
# Historia: hasta el 2026-11-13 existia solo en el cluster, mandaba todo a
# Telegram (InfoInhibitor y las «info» incluidas: ruido que se encendia y apagaba
# cada pocos minutos desde que entro RabbitMQ) y con el texto tecnico en ingles.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertas-ingenia365
  namespace: monitoring
spec:
  inhibitRules:
    - equal: [alertname, namespace]
      sourceMatch: [{ name: severity, value: critical }]
      targetMatch: [{ name: severity, value: warning }]
  receivers:
    - name: descartar
    - name: telegram
      telegramConfigs:
        - botToken: { name: telegram-alertas, key: token }
          chatID: 0 # se reemplaza al aplicar (ver cabecera)
          parseMode: HTML
          sendResolved: true
          message: |
            {{- $amb := or .CommonLabels.namespace .CommonLabels.ambiente .CommonLabels.ambiente_texto -}}
            {{- if eq .Status "resolved" -}}✅ <b>RESUELTO</b>{{- else if eq .CommonLabels.severity "critical" -}}🔴 <b>PROBLEMA GRAVE</b>{{- else -}}🟠 <b>AVISO</b>{{- end }} — {{ or .CommonAnnotations.titulo .CommonLabels.alertname | html }}

            <b>Ambiente:</b> {{ if or (eq $amb "erp-pdn") (eq $amb "pdn") }}PRODUCCIÓN{{ else if eq $amb "erp-qa" }}QA (pruebas con usuarios){{ else if eq $amb "erp-dev" }}DEV (pruebas internas){{ else if $amb }}{{ $amb }}{{ else }}servidor de monitoreo{{ end }}
            {{- if ne .Status "resolved" }}
            <b>Qué pasa:</b> {{ or .CommonAnnotations.que_pasa "Todavía no hay explicación sencilla para esta alerta; abajo va el detalle técnico." | html }}
            <b>Qué hacer:</b> {{ if .CommonAnnotations.que_hacer }}{{ .CommonAnnotations.que_hacer | html }}{{ else if eq .CommonLabels.severity "critical" }}Revisarlo pronto.{{ else }}Nada urgente; si se repite seguido, pedir que se revise.{{ end }}
            {{- end }}

            <i>Detalle técnico</i>
            <code>{{ .CommonLabels.alertname }}</code>{{ if .CommonLabels.regla_original }} ({{ .CommonLabels.regla_original }}){{ end }}{{ if .CommonLabels.severity }} · {{ .CommonLabels.severity }}{{ end }}{{ if $amb }} · {{ $amb }}{{ end }}
            {{- range .Alerts }}{{ if .Annotations.summary }}
            {{ .Annotations.summary | html }}{{ end }}{{ if .Annotations.description }}
            {{ .Annotations.description | html }}{{ end }}{{ end }}
  route:
    receiver: descartar
    groupBy: [alertname, namespace, severity]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      - matchers: [{ name: origen, value: ingenia365 }]
        receiver: telegram
