# Respaldo de MongoDB en DEV — banco de pruebas del mecanismo
#
# Existe para VALIDAR el procedimiento antes de confiarle la auditoria de
# produccion: mismo flujo, mismas imagenes, mismo Secret, distinto prefijo.
# Un respaldo que nunca se probo no es un respaldo, es una intencion.
#
# La justificacion completa del diseno esta en infrastructure/pdn/backup-mongo.yaml
# y en docs/backups.md.
#
# Ensayo manual (no hay que esperar al horario):
#   k3s kubectl create job -n erp-dev prueba-respaldo \
#     --from=cronjob/mongo-respaldo-diario
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongo-respaldo-diario
  namespace: erp-dev
  labels: { app.kubernetes.io/name: mongo-backup, app.kubernetes.io/part-of: ingenia365erp }
spec:
  schedule: "45 7 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 7200
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: { app.kubernetes.io/name: mongo-backup }
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            fsGroup: 999
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: volcado
              image: mongo:7
              # --oplog es incompatible con --db: exige instancia completa.
              command:
                - sh
                - -c
                - |
                  set -e
                  FECHA=$(date -u +%F)
                  mongodump \
                    --uri "mongodb://erp-mongo:27017/?replicaSet=rs0" \
                    --oplog --archive="/trabajo/audit-${FECHA}.archive.gz" --gzip
                  ls -lh /trabajo/
              volumeMounts: [{ name: trabajo, mountPath: /trabajo }]
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits:   { memory: 1Gi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
          containers:
            - name: subida
              image: amazon/aws-cli:2.31.9
              command:
                - sh
                - -c
                - |
                  set -e
                  FECHA=$(date -u +%F)
                  aws s3 cp "/trabajo/audit-${FECHA}.archive.gz" \
                    "s3://ingenia365-erp-backups/ingenia365-erp/mongo/dev/${FECHA}.archive.gz" \
                    --checksum-algorithm SHA256 --sse AES256
                  aws s3api head-object --bucket ingenia365-erp-backups \
                    --key "ingenia365-erp/mongo/dev/${FECHA}.archive.gz" \
                    --query 'ContentLength' --output text
              env:
                - name: HOME
                  value: /trabajo
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: s3-backup-creds, key: ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: s3-backup-creds, key: ACCESS_SECRET_KEY } }
                - name: AWS_DEFAULT_REGION
                  valueFrom: { secretKeyRef: { name: s3-backup-creds, key: AWS_REGION } }
              volumeMounts: [{ name: trabajo, mountPath: /trabajo }]
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits:   { memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: trabajo
              emptyDir: { sizeLimit: 4Gi }
