# Conector de Cloudflare Tunnel para NONPROD (DEV + QA).
#
# Es la UNICA via de entrada de trafico de usuarios: la VPS de nonprod no tiene
# NINGUN puerto abierto a internet. cloudflared abre una conexion SALIENTE hacia
# Cloudflare y el trafico vuelve por ahi.
#
# Requiere el Secret cloudflared-token:
#   .\tools\scripts\crear-secreto-tunel.ps1 -Ambiente nonprod
# (el script pide el token por teclado oculto y lo manda por STDIN sobre SSH;
# nunca como argumento ni a un archivo)
#
# El enrutamiento se configura en el panel de Cloudflare:
#   Zero Trust -> Networks -> Tunnels -> erp-nonprod -> Published applications
#     app-qa.ingenia365.com   ->  http://traefik.kube-system.svc.cluster.local:80
#     app-dev.ingenia365.com  ->  http://traefik.kube-system.svc.cluster.local:80
#     argocd-webhook.ingenia365.com -> https://argocd-server.argocd.svc.cluster.local:443
#         (No TLS Verify; solo /api/webhook pasa, el resto lo bloquea Cloudflare Access.
#          Es el webhook GitHub -> Argo CD; ver despliegue-infraestructura.md del ERP)
#
# UN SOLO tunel para los DOS ambientes, y por eso los IngressRoute de los
# overlays dev/qa llevan matcher de Host(): a este Traefik le llegan dos
# hostnames, y sin Host() las dos rutas PathPrefix(`/`) se pisan y un ambiente
# acaba sirviendo al otro. En PDN no hace falta porque alli solo llega uno.
---
# En PDN este namespace ya existia. Aqui se declara para que el manifiesto sea
# aplicable de una sola vez sobre un clúster limpio.
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare
  labels: { app.kubernetes.io/name: cloudflared }
spec:
  # DOS replicas: cada una abre sus propias conexiones al borde de Cloudflare.
  # Si un pod muere o se actualiza, el tunel NO se corta.
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: cloudflared }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cloudflared }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: cloudflared }
      containers:
        - name: cloudflared
          # POR DIGEST, no ":latest" como el manifiesto de PDN. Una etiqueta
          # movil en el unico camino de entrada al clúster significa que un dia
          # un pod se reinicia y arranca otra version sin que nadie lo haya
          # decidido. Este digest es cloudflared 2026.7.3, leido del pod que
          # corre HOY en produccion: inmutable y ya probado.
          # Al actualizar: cambiar el digest a proposito y anotar la version.
          image: cloudflare/cloudflared@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000        # metricas para Prometheus
            - run
          env:
            # Sin nombre de tunel en 'run': cloudflared lo toma del token, y con
            # el token las rutas vienen del panel. NO agregar --config aqui: un
            # cloudflared arrancado con --config IGNORA las rutas del panel, y
            # el sintoma seria un 404 sin causa aparente.
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: { name: cloudflared-token, key: token }
          ports:
            - { name: metrics, containerPort: 2000 }
          # /ready responde 200 solo si hay al menos una conexion viva con el
          # borde. Sin esto un pod con cero conexiones seguiria contando como
          # listo y el trafico moriria en silencio.
          livenessProbe:
            httpGet: { path: /ready, port: metrics }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
# Con un solo nodo, impide que un drenaje se lleve las dos replicas a la vez y
# deje DEV y QA sin entrada.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared
  namespace: cloudflare
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: cloudflared }
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
  namespace: cloudflare
  labels: { app.kubernetes.io/name: cloudflared }
spec:
  selector: { app.kubernetes.io/name: cloudflared }
  ports:
    - { name: metrics, port: 2000, targetPort: metrics }

# Webhook GitHub -> Argo CD activo desde el 2026-09-13 (ver el ERP: docs/operaciones/despliegue-infraestructura.md).
