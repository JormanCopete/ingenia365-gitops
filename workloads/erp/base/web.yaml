apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-web
  labels: { app.kubernetes.io/name: erp-web, app.kubernetes.io/part-of: ingenia365erp }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: erp-web }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: erp-web, app.kubernetes.io/part-of: ingenia365erp }
    spec:
      # La Web usa AddInteractiveWebAssemblyRenderMode SIN componentes Server:
      # no hay circuitos Blazor Server, por lo que escala horizontalmente sin
      # sticky sessions (verificado en el codigo, no asumido).
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/jormancopete/ingenia365erp/web:develop
          # Ver la nota en api.yaml: los overlays fijan el digest; Always queda de red.
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: erp-config }
          env:
            # La Web habla con la API por el Service interno del cluster.
            - name: ApiSettings__BaseUrl
              value: "http://erp-api"
            - name: AppMode__ApiBaseUrl
              value: "http://erp-api"
          # /health (imagen del 2026-09-13 en adelante): responde sin prerenderizar
          # la aplicacion. Antes las sondas pegaban a "/", que renderiza el shell
          # de Blazor entero cada 10-20 s por replica.
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
          # CPU: limite explicito (ver la nota en api.yaml: el LimitRange de
          # produccion inyectaba 500m y la Web servia el cliente WebAssembly a
          # todos los usuarios con medio nucleo).
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: erp-web
  labels: { app.kubernetes.io/name: erp-web }
spec:
  selector: { app.kubernetes.io/name: erp-web }
  ports:
    - { name: http, port: 80, targetPort: http }
