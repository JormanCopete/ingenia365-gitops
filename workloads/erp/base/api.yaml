apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-api
  labels: { app.kubernetes.io/name: erp-api, app.kubernetes.io/part-of: ingenia365erp }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: erp-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # sin corte durante el despliegue
  template:
    metadata:
      labels: { app.kubernetes.io/name: erp-api, app.kubernetes.io/part-of: ingenia365erp }
    spec:
      # Las imagenes son paquetes PRIVADOS de GHCR: contienen el codigo compilado
      # del producto. El secreto lo crea tools/scripts/crear-secreto-ghcr.ps1 del
      # repositorio de la aplicacion; el token nunca pasa por este repositorio.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/jormancopete/ingenia365erp/api:develop   # el overlay fija el DIGEST
          # Desde el 2026-09-10 los overlays despliegan por DIGEST (lo escribe el
          # CI de la aplicacion): un digest es inmutable, asi que cambiarlo es un
          # cambio real del manifiesto y Kubernetes rota los pods solo. Con la
          # etiqueta movil de antes (:release, :develop) no pasaba: republicar la
          # etiqueta no cambiaba nada, Argo decia Synced y los pods seguian con
          # la imagen de 41 horas antes. Always se conserva como red por si algun
          # overlay volviera a una etiqueta.
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: erp-config }
          env:
            # --- Base de datos (feature 004: seccion Database por variables) ---
            - name: Database__Provider
              value: PostgreSQL
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: erp-db-app, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: erp-db-app, key: password } }
            - name: Database__ConnectionStrings__PostgreSQL
              value: "Host=erp-db-rw;Port=5432;Database=ingenia365erp;Username=$(DB_USER);Password=$(DB_PASSWORD);SSL Mode=Require;Trust Server Certificate=true"
            - name: Database__AdminConnectionStrings__PostgreSQL
              value: "Host=erp-db-rw;Port=5432;Database=ingenia365erp_admin;Username=$(DB_USER);Password=$(DB_PASSWORD);SSL Mode=Require;Trust Server Certificate=true"
            # --- Dependencias ---
            - name: ConnectionStrings__Redis
              value: "erp-redis:6379,abortConnect=false"
            - name: Redis__ConnectionString
              value: "erp-redis:6379,abortConnect=false"
            # replicaSet=rs0: MongoDB corre como replica set de un nodo para
            # tener oplog (requisito de un respaldo consistente de la auditoria
            # SARLAFT). Con este parametro el driver ademas habilita
            # transacciones multidocumento y change streams.
            - name: MongoDb__ConnectionString
              value: "mongodb://erp-mongo:27017/?replicaSet=rs0"
            - name: ConnectionStrings__MongoDB
              value: "mongodb://erp-mongo:27017/?replicaSet=rs0"
            # --- Identidad: claves RS256 montadas desde Secret ---
            - name: JwtSettings__PrivateKeyPath
              value: /keys/jwt_private.pem
            - name: JwtSettings__PublicKeyPath
              value: /keys/jwt_public.pem
            # --- Bootstrap del administrador master (solo primer arranque) ---
            - name: MASTER_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: erp-master-admin, key: email, optional: true } }
            - name: MASTER_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: erp-master-admin, key: password, optional: true } }
            # --- Correo saliente: credenciales del relay ---
            # optional: un ambiente sin el Secret arranca igual; el envio falla
            # de forma visible en vez de tumbar el proceso. SmtpEmailSender solo
            # autentica si Username no esta vacio.
            - name: Smtp__Username
              valueFrom: { secretKeyRef: { name: erp-smtp, key: username, optional: true } }
            - name: Smtp__Password
              valueFrom: { secretKeyRef: { name: erp-smtp, key: password, optional: true } }
            # Segunda cuenta (Smtp:Respaldo): por ella sale el correo cuando la
            # principal agota sus reintentos. Host y remitente en el overlay;
            # credenciales en erp-smtp-respaldo (crear-secreto-smtp.ps1 -Respaldo).
            # Sin overlay que declare Smtp__Respaldo__Host no hay respaldo,
            # tenga o no Secret.
            - name: Smtp__Respaldo__Username
              valueFrom: { secretKeyRef: { name: erp-smtp-respaldo, key: username, optional: true } }
            - name: Smtp__Respaldo__Password
              valueFrom: { secretKeyRef: { name: erp-smtp-respaldo, key: password, optional: true } }
            # --- Adjuntos en S3: credencial del usuario IAM ingenia365-erp-adjuntos ---
            # Se llaman AWS_* y no AttachmentStorage__* porque quien las lee es el
            # SDK por su cadena estandar; el proceso nunca las toca. Esa credencial
            # puede escribir, leer y borrar objetos del bucket de adjuntos, pero NO
            # borrar versiones (un borrado deja marca y se recupera) y tiene un Deny
            # explicito sobre el bucket de respaldos.
            # optional: un ambiente sin el Secret arranca igual y el fallo aparece en
            # /health/ready en vez de dejar el pod en CrashLoopBackOff sin explicacion.
            # El Secret se lee AL ARRANCAR: creado despues, hay que relevar los pods.
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: erp-adjuntos-s3, key: accessKeyId, optional: true } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: erp-adjuntos-s3, key: secretAccessKey, optional: true } }
          volumeMounts:
            - { name: jwt-keys, mountPath: /keys, readOnly: true }
            - { name: attachments, mountPath: /app/storage/attachments }
          # /health/live: el proceso vive. Si falla, Kubernetes reinicia el pod.
          # Sin initialDelaySeconds: la startupProbe ya cubre el arranque y la
          # liveness no corre hasta que aquella pasa.
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # /health/ready: BD migrada y sembrada + Mongo + Redis OK. Si falla,
          # deja de recibir trafico pero NO se reinicia (evita ciclos durante migraciones).
          # timeoutSeconds explicito: el default de 1 s no alcanza. /health/ready
          # consulta PostgreSQL, MongoDB y Redis en serie; medido en DEV tarda
          # ~1 s solo el tramo de Mongo, asi que con el default la sonda expiraba
          # aunque los tres estuvieran sanos.
          # initialDelaySeconds 0 y periodo de 5 s: el pod entra al Service en
          # cuanto esta listo, no hasta 20 s despues (el retardo se cuenta desde
          # que arranca el contenedor, no desde que pasa la startupProbe).
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          # startupProbe: da hasta 5 min al primer arranque (migraciones del esquema).
          # Sigue en /health/live a proposito: /health/ready incluye Mongo, Redis y
          # el blobstore, y una dependencia caida convertiria el arranque en un
          # ciclo de reinicios.
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          # CPU: limite EXPLICITO. Hasta el 2026-09-13 no se declaraba, y el
          # LimitRange de produccion (overlays/pdn/disponibilidad.yaml) inyectaba
          # 500m por defecto —Kubernetes completa cada recurso ausente por separado—.
          # Medido en el pod: cpu.max = 50000/100000 y 97 s estrangulado de 132 s
          # de uso con la plataforma ociosa; .NET veia UN procesador (ThreadPool y
          # GC con un solo hilo) y el arranque tardaba 100-140 s. Con 2 CPU de tope
          # el nodo (6 CPU) sigue protegido y la peticion que necesita CPU la tiene.
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits:   { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Serilog escribe en logs/
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: jwt-keys
          secret: { secretName: erp-jwt-keys, defaultMode: 0400 }
        - name: attachments
          persistentVolumeClaim: { claimName: erp-attachments }
---
apiVersion: v1
kind: Service
metadata:
  name: erp-api
  labels: { app.kubernetes.io/name: erp-api }
spec:
  selector: { app.kubernetes.io/name: erp-api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: erp-attachments
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 10Gi } }
