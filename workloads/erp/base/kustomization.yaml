apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base comun de los 3 ambientes. Todo lo que varia (replicas, imagen, dominio,
# AutoMigrate, seeds) se define en overlays/{dev,qa,pdn}.
resources:
  - api.yaml
  - web.yaml
  - dependencias.yaml
  - enrutamiento.yaml

commonLabels:
  app.kubernetes.io/part-of: ingenia365erp
  app.kubernetes.io/managed-by: argocd

configMapGenerator:
  - name: erp-config
    literals:
      # Contenedores SIEMPRE en UTC. La conversion a America/Bogota ocurre solo
      # en presentacion y reportes: un cierre contable corrido 5 horas seria un
      # hallazgo de auditoria.
      - TZ=UTC
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - Database__Startup__RetryWindowSeconds=120
      - Database__Startup__RetryIntervalSeconds=5
      - PwnedPassword__Enabled=true
      - Serilog__MinimumLevel__Default=Information
      # Adjuntos en S3 (2026-09-22). Hasta ese dia los tres ambientes escribian
      # en el PVC erp-attachments: un disco local-path sin redundancia, fuera de
      # los respaldos diarios y ReadWriteOnce, o sea que con un segundo nodo una
      # de las dos replicas de la API no habria podido montarlo. Se migro con el
      # volumen VACIO en produccion, asi que no hubo nada que mover.
      # El bucket es OTRO que el de respaldos, a proposito: aquel tiene Object
      # Lock a 40 dias porque un respaldo no debe poder borrarse. Un adjunto no se
      # borra solo (feature 011): lo retira una persona con permiso y queda 90 dias
      # en la papelera del bucket versionado, de donde soporte lo recupera. Desde la
      # feature 011 el navegador sube y baja directo al bucket con autorizaciones
      # firmadas y lo nuevo lo cifra el bucket (SSE-S3); lo escrito antes sigue
      # cifrado por la aplicacion y se lee por la API. El prefijo lo pone cada overlay.
      - AttachmentStorage__Provider=S3
      - AttachmentStorage__S3__BucketName=ingenia365-erp-attachments
      - AttachmentStorage__S3__Region=us-east-1

generatorOptions:
  disableNameSuffixHash: false   # el hash fuerza rollout cuando cambia la config
