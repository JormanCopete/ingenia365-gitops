# Redis (cache de membresias, locks distribuidos, contadores de lockout de login
# y backplane de SignalR cuando la API escale a varias replicas) y MongoDB
# (auditoria SARLAFT). PostgreSQL NO esta aqui: lo gobierna CloudNativePG.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-redis
  labels: { app.kubernetes.io/name: erp-redis }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: erp-redis } }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app.kubernetes.io/name: erp-redis }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999 }
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - --appendonly
            - "yes"
            - --maxmemory
            - "256mb"
            - --maxmemory-policy
            - allkeys-lru
          ports: [{ name: redis, containerPort: 6379 }]
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 384Mi }
          volumeMounts: [{ name: data, mountPath: /data }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: erp-redis-data }
---
apiVersion: v1
kind: Service
metadata:
  name: erp-redis
spec:
  selector: { app.kubernetes.io/name: erp-redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: erp-redis-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: erp-mongo
  labels: { app.kubernetes.io/name: erp-mongo }
spec:
  serviceName: erp-mongo
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: erp-mongo } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: erp-mongo }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999 }
      containers:
        - name: mongo
          image: mongo:7
          ports: [{ name: mongo, containerPort: 27017 }]
          livenessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            exec: { command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"] }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits:   { memory: 1Gi }
          volumeMounts: [{ name: data, mountPath: /data/db }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        # ATENCION: la auditoria SARLAFT (retencion 5 anos) vive aqui y NO esta
        # cubierta por los backups de CloudNativePG. Requiere su propio respaldo
        # a S3 con inmutabilidad - ver docs/backups.md.
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: erp-mongo
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: erp-mongo }
  ports: [{ name: mongo, port: 27017, targetPort: mongo }]
