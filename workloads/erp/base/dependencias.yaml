# Redis (cache de membresias, locks distribuidos, contadores de lockout de login
# y backplane de SignalR cuando la API escale a varias replicas) y MongoDB
# (auditoria SARLAFT). PostgreSQL NO esta aqui: lo gobierna CloudNativePG.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-redis
  labels: { app.kubernetes.io/name: erp-redis }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: erp-redis } }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app.kubernetes.io/name: erp-redis }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999 }
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - --appendonly
            - "yes"
            - --maxmemory
            - "256mb"
            - --maxmemory-policy
            - allkeys-lru
          ports: [{ name: redis, containerPort: 6379 }]
          # timeoutSeconds explicito: redis-cli tambien lanza un proceso. Arranca
          # mucho mas rapido que mongosh, pero con el default de 1 s bastaria una
          # pausa de CPU para que kubelet reiniciara un Redis perfectamente sano.
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 384Mi }
          volumeMounts: [{ name: data, mountPath: /data }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: erp-redis-data }
---
apiVersion: v1
kind: Service
metadata:
  name: erp-redis
spec:
  selector: { app.kubernetes.io/name: erp-redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: erp-redis-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: erp-mongo
  labels: { app.kubernetes.io/name: erp-mongo }
spec:
  serviceName: erp-mongo
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: erp-mongo } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: erp-mongo }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999 }
      initContainers:
        # LA RAIZ DE TODO EL PROBLEMA: mongod resuelve el nombre de su miembro
        # del replica set AL ARRANCAR y decide ahi si se reconoce. No lo
        # reevalua nunca mas. Al recrear el pod cambia su IP, y CoreDNS puede
        # seguir devolviendo la anterior hasta 30 s por su cache; mongod arranca
        # en ~2 s, concluye "no soy miembro" y queda con
        # InvalidReplicaSetConfig de forma permanente, sin oplog y sin respaldo
        # posible. Reparar eso exige un rs.reconfig({force:true}) a mano.
        #
        # Esperar aca saca al DNS del camino critico: mongod no arranca hasta
        # que su propio nombre apunta a este pod.
        - name: esperar-dns
          image: mongo:7
          env:
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          command:
            - sh
            - -c
            - |
              for i in $(seq 1 90); do
                IP=$(getent hosts erp-mongo-0.erp-mongo 2>/dev/null | awk '{print $1}' | head -1)
                if [ "$IP" = "$POD_IP" ]; then
                  echo "[esperar-dns] correcto tras $((i*2))s: $IP"
                  exit 0
                fi
                [ $((i % 15)) -eq 0 ] && echo "[esperar-dns] ${i}: devuelve '$IP', se espera '$POD_IP'"
                sleep 2
              done
              # Fallar es lo correcto: kubelet reintenta el init y el pod queda
              # en Init, estado recuperable. Arrancar mongod con el DNS mal
              # deja una base rota que solo se repara a mano.
              echo "[esperar-dns] el DNS no convergio en 180s"
              exit 1
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: mongo
          image: mongo:7
          ports: [{ name: mongo, containerPort: 27017 }]
          # Replica set de UN nodo. No cambia la topologia ni el consumo, pero
          # habilita el oplog, y sin oplog `mongodump` no puede tomar una copia
          # CONSISTENTE: sin el, el volcado mezcla escrituras de distintos
          # instantes y el resultado no es evidencia defendible para SARLAFT.
          # Ademas desbloquea transacciones multidocumento, change streams y
          # Percona Backup for MongoDB (que no soporta standalone) sin migrar.
          #
          # Se hace AHORA porque convertir una base vacia es gratis; hacerlo con
          # cinco anos de auditoria encima es una migracion.
          args: ["--replSet", "rs0", "--bind_ip_all"]
          env:
            # Lo usa el hook para confirmar que su nombre DNS ya apunta a ESTE
            # pod antes de iniciar el replica set.
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          lifecycle:
            postStart:
              exec:
                # Idempotente: si el replica set ya existe, no toca nada.
                #
                # La salida va a /proc/1/fd/1, es decir, a la salida estandar de
                # mongod: asi aparece en `kubectl logs`. La primera version
                # mandaba todo a /dev/null y terminaba en `exit 0`, de modo que
                # una iniciacion fallida se veia igual que no haber hecho nada.
                # Un proceso de arranque que oculta su propio fallo cuesta mas
                # de diagnosticar que uno que no existe.
                #
                # Sale siempre con exito para no matar el contenedor; que la
                # iniciacion haya funcionado lo verifica la sonda de
                # disponibilidad, que exige ser PRIMARY.
                command:
                  - sh
                  - -c
                  - |
                    exec >>/proc/1/fd/1 2>&1
                    echo "[rs-init] esperando a que mongod acepte conexiones"
                    for i in $(seq 1 60); do
                      mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1 && break
                      sleep 2
                    done
                    # REINTENTOS, no una ventana fija. mongod valida que algun
                    # miembro de la configuracion resuelva A SI MISMO y rechaza
                    # el conjunto con NodeNotFound si no; tras recrear el pod ese
                    # registro DNS tarda en publicarse, y se midio que puede
                    # tardar mas de tres minutos.
                    #
                    # La version anterior esperaba una ventana fija y luego hacia
                    # UN solo intento. Al agotarse la ventana fallaba para
                    # siempre: postStart corre una unica vez por arranque del
                    # contenedor, de modo que una carrera perdida contra el DNS
                    # dejaba el nodo standalone de forma permanente.
                    #
                    # Reintentar es lo correcto: no hace falta acertar cuanto
                    # tarda el DNS, solo insistir hasta que responda.
                    for i in $(seq 1 90); do
                      RES=$(mongosh --quiet --eval '
                        try {
                          var s = rs.status();
                          print("LISTO " + s.set + " estado=" + s.myState);
                        } catch (e) {
                          try {
                            rs.initiate({_id:"rs0",members:[{_id:0,host:"erp-mongo-0.erp-mongo:27017"}]});
                            print("INICIADO");
                          } catch (e2) {
                            print("PENDIENTE " + e2.codeName);
                          }
                        }' 2>&1 | tail -1)
                      echo "[rs-init] intento $i: $RES"
                      case "$RES" in
                        LISTO*|INICIADO*) echo "[rs-init] replica set operativo"; break ;;
                      esac
                      sleep 5
                    done
                    exit 0
          # OJO con timeoutSeconds: si no se declara, Kubernetes usa 1 SEGUNDO.
          # `mongosh` es una shell de Node y tarda varios segundos solo en
          # arrancar, asi que ninguna sonda alcanzaba a responder: la de vida
          # fallaba 3 veces seguidas y kubelet mataba el contenedor. MongoDB
          # estaba sano y aun asi acumulo 43 reinicios.
          #
          # Vida: comprobacion TCP, que no lanza ningun proceso. Responde "el
          # servidor esta escuchando", que es justo lo que debe decidir si se
          # reinicia el contenedor.
          livenessProbe:
            tcpSocket: { port: mongo }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # Disponibilidad: exige ser PRIMARY del replica set, no solo responder
          # al ping. Es lo que la aplicacion necesita de verdad (escribe), y
          # convierte una iniciacion fallida del replica set en un fallo visible
          # en vez de una base que responde pero no genera oplog — es decir, sin
          # respaldo consistente y sin que nadie se entere.
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "quit(rs.status().myState === 1 ? 0 : 1)"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          # Da hasta 2 minutos al primer arranque (creacion de /data/db y
          # recuperacion del journal) sin que la sonda de vida intervenga.
          startupProbe:
            tcpSocket: { port: mongo }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits:   { cpu: "1", memory: 1Gi }
          volumeMounts: [{ name: data, mountPath: /data/db }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        # ATENCION: la auditoria SARLAFT (retencion 5 anos) vive aqui y NO esta
        # cubierta por los backups de CloudNativePG. Requiere su propio respaldo
        # a S3 con inmutabilidad - ver docs/backups.md.
        #
        # Este numero es CONTABLE, no un limite: el provisionador local-path no
        # aplica cuota, asi que el volumen dispone del disco entero del nodo
        # (medido: 193G totales, 179G libres). Se deja en 5Gi porque coincide con
        # los StatefulSet ya creados y volumeClaimTemplates es INMUTABLE: pedir
        # otro tamano deja la aplicacion OutOfSync de forma permanente sin que
        # Argo pueda reconciliarla nunca.
        #
        # El dia que se migre a un almacenamiento que SI aplique cuota y ofrezca
        # redundancia, cambiar este valor exige recrear el StatefulSet.
        resources: { requests: { storage: 5Gi } }
        # volumeMode explicito aunque sea el valor por defecto: el API server lo
        # rellena solo, y al no estar declarado Argo comparaba un manifiesto sin
        # el campo contra un objeto que si lo tiene y marcaba la aplicacion
        # OutOfSync de forma permanente. `kubectl diff` salia limpio, o sea que
        # no habia deriva real: era ruido de normalizacion. Declararlo lo elimina.
        volumeMode: Filesystem
---
apiVersion: v1
kind: Service
metadata:
  name: erp-mongo
spec:
  clusterIP: None
  # publishNotReadyAddresses ROMPE UN BLOQUEO CIRCULAR, no es una relajacion:
  # rs.initiate() necesita resolver su propio nombre DNS (erp-mongo-0.erp-mongo),
  # pero Kubernetes solo publica ese registro cuando el pod esta Ready; y estar
  # Ready exige ser PRIMARY, que exige justamente la iniciacion. Sin esto el pod
  # nunca arranca el replica set: verificado en DEV, el endpoint quedaba en
  # notReadyAddresses y el nombre no resolvia.
  #
  # Es el patron estandar para bases de datos en StatefulSet. No expone nada de
  # mas: el Service es headless y la NetworkPolicy sigue mandando.
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/name: erp-mongo }
  ports: [{ name: mongo, port: 27017, targetPort: mongo }]
