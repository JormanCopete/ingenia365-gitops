# Redis (cache de membresias, locks distribuidos, contadores de lockout de login
# y backplane de SignalR cuando la API escale a varias replicas) y MongoDB
# (auditoria SARLAFT). PostgreSQL NO esta aqui: lo gobierna CloudNativePG.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-redis
  labels: { app.kubernetes.io/name: erp-redis }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: erp-redis } }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app.kubernetes.io/name: erp-redis }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999 }
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - --appendonly
            - "yes"
            - --maxmemory
            - "256mb"
            - --maxmemory-policy
            - allkeys-lru
          ports: [{ name: redis, containerPort: 6379 }]
          # timeoutSeconds explicito: redis-cli tambien lanza un proceso. Arranca
          # mucho mas rapido que mongosh, pero con el default de 1 s bastaria una
          # pausa de CPU para que kubelet reiniciara un Redis perfectamente sano.
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 384Mi }
          volumeMounts: [{ name: data, mountPath: /data }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: erp-redis-data }
---
apiVersion: v1
kind: Service
metadata:
  name: erp-redis
spec:
  selector: { app.kubernetes.io/name: erp-redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: erp-redis-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: erp-mongo
  labels: { app.kubernetes.io/name: erp-mongo }
spec:
  serviceName: erp-mongo
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: erp-mongo } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: erp-mongo }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999 }
      containers:
        - name: mongo
          image: mongo:7
          ports: [{ name: mongo, containerPort: 27017 }]
          # Replica set de UN nodo. No cambia la topologia ni el consumo, pero
          # habilita el oplog, y sin oplog `mongodump` no puede tomar una copia
          # CONSISTENTE: sin el, el volcado mezcla escrituras de distintos
          # instantes y el resultado no es evidencia defendible para SARLAFT.
          # Ademas desbloquea transacciones multidocumento, change streams y
          # Percona Backup for MongoDB (que no soporta standalone) sin migrar.
          #
          # Se hace AHORA porque convertir una base vacia es gratis; hacerlo con
          # cinco anos de auditoria encima es una migracion.
          args: ["--replSet", "rs0", "--bind_ip_all"]
          lifecycle:
            postStart:
              exec:
                # Idempotente: si el replica set ya existe, no toca nada. Sale
                # siempre con exito para no matar el contenedor — que la
                # iniciacion funciono lo verifica la sonda de disponibilidad,
                # que exige ser PRIMARY. Asi un fallo se nota, no se disimula.
                command:
                  - sh
                  - -c
                  - |
                    for i in $(seq 1 60); do
                      mongosh --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1 && break
                      sleep 2
                    done
                    mongosh --quiet --eval '
                      try { rs.status(); }
                      catch (e) {
                        rs.initiate({_id:"rs0",members:[{_id:0,host:"erp-mongo-0.erp-mongo:27017"}]});
                      }' >/dev/null 2>&1
                    exit 0
          # OJO con timeoutSeconds: si no se declara, Kubernetes usa 1 SEGUNDO.
          # `mongosh` es una shell de Node y tarda varios segundos solo en
          # arrancar, asi que ninguna sonda alcanzaba a responder: la de vida
          # fallaba 3 veces seguidas y kubelet mataba el contenedor. MongoDB
          # estaba sano y aun asi acumulo 43 reinicios.
          #
          # Vida: comprobacion TCP, que no lanza ningun proceso. Responde "el
          # servidor esta escuchando", que es justo lo que debe decidir si se
          # reinicia el contenedor.
          livenessProbe:
            tcpSocket: { port: mongo }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # Disponibilidad: exige ser PRIMARY del replica set, no solo responder
          # al ping. Es lo que la aplicacion necesita de verdad (escribe), y
          # convierte una iniciacion fallida del replica set en un fallo visible
          # en vez de una base que responde pero no genera oplog — es decir, sin
          # respaldo consistente y sin que nadie se entere.
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "quit(rs.status().myState === 1 ? 0 : 1)"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          # Da hasta 2 minutos al primer arranque (creacion de /data/db y
          # recuperacion del journal) sin que la sonda de vida intervenga.
          startupProbe:
            tcpSocket: { port: mongo }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits:   { memory: 1Gi }
          volumeMounts: [{ name: data, mountPath: /data/db }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        # ATENCION: la auditoria SARLAFT (retencion 5 anos) vive aqui y NO esta
        # cubierta por los backups de CloudNativePG. Requiere su propio respaldo
        # a S3 con inmutabilidad - ver docs/backups.md.
        #
        # Este numero es CONTABLE, no un limite: el provisionador local-path no
        # aplica cuota, asi que el volumen dispone del disco entero del nodo
        # (medido: 193G totales, 179G libres). Se deja en 5Gi porque coincide con
        # los StatefulSet ya creados y volumeClaimTemplates es INMUTABLE: pedir
        # otro tamano deja la aplicacion OutOfSync de forma permanente sin que
        # Argo pueda reconciliarla nunca.
        #
        # El dia que se migre a un almacenamiento que SI aplique cuota y ofrezca
        # redundancia, cambiar este valor exige recrear el StatefulSet.
        resources: { requests: { storage: 5Gi } }
        # volumeMode explicito aunque sea el valor por defecto: el API server lo
        # rellena solo, y al no estar declarado Argo comparaba un manifiesto sin
        # el campo contra un objeto que si lo tiene y marcaba la aplicacion
        # OutOfSync de forma permanente. `kubectl diff` salia limpio, o sea que
        # no habia deriva real: era ruido de normalizacion. Declararlo lo elimina.
        volumeMode: Filesystem
---
apiVersion: v1
kind: Service
metadata:
  name: erp-mongo
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: erp-mongo }
  ports: [{ name: mongo, port: 27017, targetPort: mongo }]
