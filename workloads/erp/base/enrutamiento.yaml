# Entrada unica del producto (FR-007 del feature 002): un solo host sirve la Web
# y la API bajo /api. Consecuencias buscadas:
#   - Cero CORS (mismo origen).
#   - Una sola imagen WASM sirve los 3 ambientes (usa rutas relativas).
#   - El tenant se resuelve del claim active_tenant_id, NUNCA del subdominio.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: erp-security-headers
spec:
  headers:
    stsSeconds: 0                      # HSTS lo gobierna Cloudflare, no el origen
    frameDeny: true                    # sin embebido en iframes (anti clickjacking)
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      X-Powered-By: ""                 # no revelar la pila tecnologica
      Server: ""
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: erp
spec:
  entryPoints: [web]                   # cloudflared entra por HTTP dentro del cluster;
                                       # el cifrado externo lo da el tunel de Cloudflare
  routes:
    # La API primero: las reglas mas especificas se evaluan por prioridad.
    - kind: Rule
      match: PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/hubs`) || PathPrefix(`/swagger`)
      priority: 100
      services:
        - { name: erp-api, port: 80 }
      middlewares:
        - { name: erp-security-headers }
    # Todo lo demas es la Web (Blazor).
    - kind: Rule
      match: PathPrefix(`/`)
      priority: 1
      services:
        - { name: erp-web, port: 80 }
      middlewares:
        - { name: erp-security-headers }
