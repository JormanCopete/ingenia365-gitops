apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: erp-dev
resources:
  - ../../base
# DEV: se auto-migra y se siembra con datos demo. Es el ambiente donde el
# esquema puede romperse sin consecuencias.
configMapGenerator:
  - name: erp-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Development
      - Database__AutoMigrate=true
      - Database__Seed__RunParametricSeed=true
      - Database__Seed__RunTestSeed=true
      # Ver la nota del overlay de QA: EmailSender__* no lo leia nadie.
      - IdentityEmail__BaseUrl=https://app-dev.ingenia365.com
      # Sin estas dos la API no arranca (ValidateOnStart, sin valor por defecto).
      # El dominio raiz sirve para los tres ambientes; una passkey inscrita en
      # DEV igual no vale en QA ni en PDN, eso lo separa el navegador.
      - WebAuthn__RelyingPartyId=ingenia365.com
      - WebAuthn__OrigenesPermitidos__0=https://app-dev.ingenia365.com
      - Serilog__MinimumLevel__Default=Debug
      # Prefijo de este ambiente dentro del bucket de adjuntos. NO se guarda en
      # la base (COR_Attachments.BlobUri lleva la referencia sin el), asi que
      # mover el prefijo -o el bucket- no invalida lo ya escrito.
      - AttachmentStorage__S3__Prefix=dev
# Imagenes por DIGEST, no por etiqueta (P3, cerrado el 2026-09-10).
#
# Estas lineas las escribe el CI del repositorio de la aplicacion (job "gitops"
# de .github/workflows/ci.yml) cada vez que publica imagenes desde la rama que
# alimenta este ambiente. No editarlas a mano salvo para volver a una version
# anterior: cambiar el digest ES el despliegue, y Argo CD lo ve como un cambio
# real del manifiesto, que es lo que la etiqueta movil nunca fue.
#
# Con la etiqueta (:develop, :release) pasaba esto: se republicaba la imagen, el
# manifiesto no cambiaba, Argo decia Synced y los pods seguian con la imagen
# vieja hasta que alguien hacia rollout restart. Tres veces en produccion.
images:
  - name: ghcr.io/jormancopete/ingenia365erp/api
    digest: sha256:6612ef598fda6788b394876285a3f48a849696dbd85ec455d848c943aa6b2f5f
  - name: ghcr.io/jormancopete/ingenia365erp/web
    digest: sha256:1d286c9297461e6408862e5c01d6604f2e0df0d799f0b686d0a11d01124eb57e
patches:
  # Recursos reducidos: DEV y QA comparten un nodo con la observabilidad.
  - target: {kind: Deployment, name: erp-api}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
  - target: {kind: StatefulSet, name: erp-mongo}
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
  # Ver la nota del overlay de QA: DEV y QA comparten el Traefik de nonprod y
  # sin Host() las rutas se pisan entre namespaces.
  - target: {group: traefik.io, version: v1alpha1, kind: IngressRoute, name: erp}
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`app-dev.ingenia365.com`) && (PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/hubs`) || PathPrefix(`/swagger`))
      - op: replace
        path: /spec/routes/1/match
        value: Host(`app-dev.ingenia365.com`) && PathPrefix(`/`)
