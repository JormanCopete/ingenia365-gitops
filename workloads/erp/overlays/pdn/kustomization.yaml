apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: erp-pdn
resources:
  - ../../base
  - migracion-job.yaml
  - disponibilidad.yaml
# PRODUCCION: no se auto-migra (fail-fast si hay pendientes) y no lleva datos
# demo. El esquema lo aplica el Job PreSync antes de rotar los pods.
configMapGenerator:
  - name: erp-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__AutoMigrate=false
      - Database__Seed__RunParametricSeed=true
      - Database__Seed__RunTestSeed=false
      # Ver la nota del overlay de QA: las dos claves EmailSender__* que habia
      # aqui no las leia ningun codigo. Es lo que hacia que los enlaces de las
      # invitaciones y del restablecimiento de contrasena de PRODUCCION
      # apuntaran a https://localhost:7200 desde siempre.
      - IdentityEmail__BaseUrl=https://app.ingenia365.com
      # Sin estas dos la API no arranca (ValidateOnStart, sin valor por defecto).
      - WebAuthn__RelyingPartyId=ingenia365.com
      - WebAuthn__OrigenesPermitidos__0=https://app.ingenia365.com
      - Serilog__MinimumLevel__Default=Information
# Imagenes por DIGEST, no por etiqueta (P3, cerrado el 2026-09-10).
#
# Estas lineas las escribe el CI del repositorio de la aplicacion (job "gitops"
# de .github/workflows/ci.yml) cada vez que publica imagenes desde la rama que
# alimenta este ambiente. No editarlas a mano salvo para volver a una version
# anterior: cambiar el digest ES el despliegue, y Argo CD lo ve como un cambio
# real del manifiesto, que es lo que la etiqueta movil nunca fue.
#
# Con la etiqueta (:develop, :release) pasaba esto: se republicaba la imagen, el
# manifiesto no cambiaba, Argo decia Synced y los pods seguian con la imagen
# vieja hasta que alguien hacia rollout restart. Tres veces en produccion.
# En produccion el CI solo deja el commit: la sincronizacion sigue siendo manual
# en Argo CD, y el digest en el commit es lo que se aprueba.
images:
  - name: ghcr.io/jormancopete/ingenia365erp/api
    digest: sha256:2ab24617ad9d5fe7ecb04b0717cc2bbef33734d3e77ef277bfc53c5cb6514a49
  - name: ghcr.io/jormancopete/ingenia365erp/web
    digest: sha256:6017820f962e1119342b3c46c61876b3013a285261ec775d98581ab21bdc598b
  - name: ghcr.io/jormancopete/ingenia365erp/migrator
    digest: sha256:f44006e3ebaddef55610d28a789fb053e2f28e9b91e643f49310e323d0354254
patches:
  # Dos replicas de API y Web: un pod puede morir sin cortar el servicio.
  # (La Web no tiene circuitos Blazor Server, asi que no necesita afinidad.)
  - target: {kind: Deployment, name: erp-api}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: Deployment, name: erp-web}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
