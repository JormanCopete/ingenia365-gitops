apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: erp-pdn
resources:
  - ../../base
  - migracion-job.yaml
  - disponibilidad.yaml
# PRODUCCION: no se auto-migra (fail-fast si hay pendientes) y no lleva datos
# demo. El esquema lo aplica el Job PreSync antes de rotar los pods.
configMapGenerator:
  - name: erp-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__AutoMigrate=false
      - Database__Seed__RunParametricSeed=true
      - Database__Seed__RunTestSeed=false
      # Ver la nota del overlay de QA: las dos claves EmailSender__* que habia
      # aqui no las leia ningun codigo. Es lo que hacia que los enlaces de las
      # invitaciones y del restablecimiento de contrasena de PRODUCCION
      # apuntaran a https://localhost:7200 desde siempre.
      - IdentityEmail__BaseUrl=https://app.ingenia365.com
      # Sin estas dos la API no arranca (ValidateOnStart, sin valor por defecto).
      - WebAuthn__RelyingPartyId=ingenia365.com
      - WebAuthn__OrigenesPermitidos__0=https://app.ingenia365.com
      - Serilog__MinimumLevel__Default=Information
      # Correo saliente (mismo relay que QA). Hasta el 2026-09-11 produccion no
      # tenia ninguna clave Smtp__ y regia localhost:25: al registrar la primera
      # cooperativa (COOFLOPAL) la invitacion del administrador no salio y el
      # boton «Reenviar» respondia 500 tras cuatro intentos contra un puerto
      # cerrado. Usuario y contrasena NO van aqui: van en el Secret erp-smtp
      # (tools/scripts/crear-secreto-smtp.ps1 -Ambiente pdn en el repo del ERP).
      # Sin ese Secret la API arranca igual y el envio falla con autenticacion.
      - Smtp__Host=mail.notifica365.com
      - Smtp__Port=587
      - Smtp__UseStartTls=true
      - Smtp__FromAddress=noresponder.ingenia365erp@notifica365.com
      - Smtp__FromName=No Responder IngenIA365 ERP
      # PARCHE, no secreto: huella publica del certificado autofirmado que
      # presenta mail.notifica365.com (ver la nota del overlay de QA). Borrar
      # cuando el servidor tenga un certificado valido.
      - Smtp__HuellaCertificadoAceptada=54EA10957D7018ADE475CA084C1CADD14030D460CD6EED62F7CEDCDA15974E1C
      # Cuenta de RESPALDO (2026-09-12): si la principal agota sus reintentos, el
      # correo sale por esta, con su propio remitente (el servidor exige que el
      # «De:» sea la cuenta autenticada). Mismo servidor, asi que cubre un buzon
      # bloqueado o una contrasena vencida, NO una caida del relay. Credenciales
      # en el Secret erp-smtp-respaldo.
      - Smtp__Respaldo__Host=mail.notifica365.com
      - Smtp__Respaldo__Port=587
      - Smtp__Respaldo__UseStartTls=true
      - Smtp__Respaldo__FromAddress=ingeniaerp@notifica365.com
      - Smtp__Respaldo__FromName=IngenIA365 ERP
      - Smtp__Respaldo__HuellaCertificadoAceptada=54EA10957D7018ADE475CA084C1CADD14030D460CD6EED62F7CEDCDA15974E1C
# Imagenes por DIGEST, no por etiqueta (P3, cerrado el 2026-09-10).
#
# Estas lineas las escribe el CI del repositorio de la aplicacion (job "gitops"
# de .github/workflows/ci.yml) cada vez que publica imagenes desde la rama que
# alimenta este ambiente. No editarlas a mano salvo para volver a una version
# anterior: cambiar el digest ES el despliegue, y Argo CD lo ve como un cambio
# real del manifiesto, que es lo que la etiqueta movil nunca fue.
#
# Con la etiqueta (:develop, :release) pasaba esto: se republicaba la imagen, el
# manifiesto no cambiaba, Argo decia Synced y los pods seguian con la imagen
# vieja hasta que alguien hacia rollout restart. Tres veces en produccion.
# En produccion el CI solo deja el commit: la sincronizacion sigue siendo manual
# en Argo CD, y el digest en el commit es lo que se aprueba.
images:
  - name: ghcr.io/jormancopete/ingenia365erp/api
    digest: sha256:1d1d3d74db2d24b81ab137d12842020e98f225b2f799bc3959edef16f2dca6a0
  - name: ghcr.io/jormancopete/ingenia365erp/web
    digest: sha256:becd5155b8123188e8574d775c1f33b8bcc177a2868ffd73d2a03ae5c09c34dd
  - name: ghcr.io/jormancopete/ingenia365erp/migrator
    digest: sha256:e733e90ab57fe663819ff34aa5af8cba073c5e41fff151744f19cb1dc409e393
patches:
  # Dos replicas de API y Web: un pod puede morir sin cortar el servicio.
  # (La Web no tiene circuitos Blazor Server, asi que no necesita afinidad.)
  - target: {kind: Deployment, name: erp-api}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: Deployment, name: erp-web}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
