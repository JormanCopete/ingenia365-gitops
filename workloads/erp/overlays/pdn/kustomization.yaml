apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: erp-pdn
resources:
  - ../../base
  - migracion-job.yaml
  - disponibilidad.yaml
# Feature 011 (US5): credenciales TEMPORALES para el bucket de adjuntos con IAM
# Roles Anywhere desde el primer dia: produccion nunca usa la llave permanente.
# Requiere el Secret erp-adjuntos-certificado en erp-pdn
# (crear-certificados-adjuntos.ps1 -Ambientes pdn). Receta del ERP:
# docs/operaciones/despliegue-adjuntos-directos.md.
components:
  - ../../components/adjuntos-roles-anywhere
  # T986 (feature 012 del ERP): Mongo con autenticacion y claves propias de firma
  # de auditoria. Requiere los Secrets del componente (ver su cabecera).
  - ../../components/auditoria-protegida
  # Feature 023 del ERP: RabbitMQ despierta y reparte la emision electronica y la
  # bandeja de integracion. Requiere el Secret erp-rabbitmq en erp-pdn (instalado el
  # 2026-11-12 con crear-secreto-rabbitmq.ps1; ver la cabecera del componente).
  - ../../components/mensajeria
  # Feature 028 del ERP: credenciales de facturacion electronica (Secret
  # erp-fe-credenciales, opcional) para el canal IngenIA Conecta.
  - ../../components/facturacion-electronica
# PRODUCCION: no se auto-migra (fail-fast si hay pendientes) y no lleva datos
# demo. El esquema lo aplica el Job PreSync antes de rotar los pods.
configMapGenerator:
  - name: erp-config
    behavior: merge
    literals:
      # Feature 028: extremos de IngenIA Conecta (la vigencia guarda la clave, nunca
      # la URL). CONECTA-PRUEBAS = tenant en habilitacion en Conecta PDN; CONECTA =
      # validez legal. Conecta PDN acepta el numero del ERP desde la v0.1.4
      # (2026-11-28, pedido D1): se enciende solo para CONECTA-PRUEBAS. CONECTA
      # (real) sigue apagado hasta probar de punta a punta en habilitacion.
      - ElectronicInvoicing__Channels__CONECTA_PRUEBAS__Endpoints__PDN=https://conecta.ingenia365.com
      - ElectronicInvoicing__Channels__CONECTA_PRUEBAS__ConectaAceptaNumeroDelErp=true
      - ElectronicInvoicing__Channels__CONECTA__Endpoints__PDN=https://conecta.ingenia365.com
      - ASPNETCORE_ENVIRONMENT=Production
      - Database__AutoMigrate=false
      - Database__Seed__RunParametricSeed=true
      - Database__Seed__RunTestSeed=false
      # Ver la nota del overlay de QA: las dos claves EmailSender__* que habia
      # aqui no las leia ningun codigo. Es lo que hacia que los enlaces de las
      # invitaciones y del restablecimiento de contrasena de PRODUCCION
      # apuntaran a https://localhost:7200 desde siempre.
      - IdentityEmail__BaseUrl=https://app.ingenia365.com
      # Sin estas dos la API no arranca (ValidateOnStart, sin valor por defecto).
      - WebAuthn__RelyingPartyId=ingenia365.com
      - WebAuthn__OrigenesPermitidos__0=https://app.ingenia365.com
      - Serilog__MinimumLevel__Default=Information
      # Correo saliente (mismo relay que QA). Hasta el 2026-09-11 produccion no
      # tenia ninguna clave Smtp__ y regia localhost:25: al registrar la primera
      # cooperativa (COOFLOPAL) la invitacion del administrador no salio y el
      # boton «Reenviar» respondia 500 tras cuatro intentos contra un puerto
      # cerrado. Usuario y contrasena NO van aqui: van en el Secret erp-smtp
      # (tools/scripts/crear-secreto-smtp.ps1 -Ambiente pdn en el repo del ERP).
      # Sin ese Secret la API arranca igual y el envio falla con autenticacion.
      - Smtp__Host=mail.notifica365.com
      - Smtp__Port=587
      - Smtp__UseStartTls=true
      - Smtp__FromAddress=noresponder.ingenia365erp@notifica365.com
      - Smtp__FromName=No Responder IngenIA365 ERP
      # PARCHE, no secreto: huella publica del certificado autofirmado que
      # presenta mail.notifica365.com (ver la nota del overlay de QA). Borrar
      # cuando el servidor tenga un certificado valido.
      - Smtp__HuellaCertificadoAceptada=54EA10957D7018ADE475CA084C1CADD14030D460CD6EED62F7CEDCDA15974E1C
      # Cuenta de RESPALDO (2026-09-12): si la principal agota sus reintentos, el
      # correo sale por esta, con su propio remitente (el servidor exige que el
      # «De:» sea la cuenta autenticada). Mismo servidor, asi que cubre un buzon
      # bloqueado o una contrasena vencida, NO una caida del relay. Credenciales
      # en el Secret erp-smtp-respaldo.
      - Smtp__Respaldo__Host=mail.notifica365.com
      - Smtp__Respaldo__Port=587
      - Smtp__Respaldo__UseStartTls=true
      - Smtp__Respaldo__FromAddress=ingeniaerp@notifica365.com
      - Smtp__Respaldo__FromName=IngenIA365 ERP
      - Smtp__Respaldo__HuellaCertificadoAceptada=54EA10957D7018ADE475CA084C1CADD14030D460CD6EED62F7CEDCDA15974E1C
      # Prefijo de este ambiente dentro del bucket de adjuntos. NO se guarda en
      # la base (COR_Attachments.BlobUri lleva la referencia sin el), asi que
      # mover el prefijo -o el bucket- no invalida lo ya escrito.
      - AttachmentStorage__S3__Prefix=pdn
  # Salidas de la pila CloudFormation ingenia365-erp-adjuntos-roles-anywhere
  # (cuenta 058264424927, us-east-1). No son secretos. El rol de produccion solo
  # alcanza el prefijo pdn/ del bucket.
  - name: erp-roles-anywhere
    literals:
      - trustAnchorArn=arn:aws:rolesanywhere:us-east-1:058264424927:trust-anchor/415c26a3-caea-4e6a-9cf8-303f37a917b4
      - profileArn=arn:aws:rolesanywhere:us-east-1:058264424927:profile/65d851ed-8722-497e-ad76-cd48bdf24fec
      - roleArn=arn:aws:iam::058264424927:role/ingenia365-erp-adjuntos-pdn
# Imagenes por DIGEST, no por etiqueta (P3, cerrado el 2026-09-10).
#
# Estas lineas las escribe el CI del repositorio de la aplicacion (job "gitops"
# de .github/workflows/ci.yml) cada vez que publica imagenes desde la rama que
# alimenta este ambiente. No editarlas a mano salvo para volver a una version
# anterior: cambiar el digest ES el despliegue, y Argo CD lo ve como un cambio
# real del manifiesto, que es lo que la etiqueta movil nunca fue.
#
# Con la etiqueta (:develop, :release) pasaba esto: se republicaba la imagen, el
# manifiesto no cambiaba, Argo decia Synced y los pods seguian con la imagen
# vieja hasta que alguien hacia rollout restart. Tres veces en produccion.
# En produccion el CI solo deja el commit: la sincronizacion sigue siendo manual
# en Argo CD, y el digest en el commit es lo que se aprueba.
images:
  - name: ghcr.io/jormancopete/ingenia365erp/api
    digest: sha256:0a804004ab049907809ccce6ba59443cdae51849764ad2ebe1ce801892fa307b
  - name: ghcr.io/jormancopete/ingenia365erp/web
    digest: sha256:17818650ab6d6e91e3327b77c10d66f281473828b9d58928f54b663cb4f7c01e
  - name: ghcr.io/jormancopete/ingenia365erp/migrator
    digest: sha256:330f1b94f3a41cf577152f248ade4f180ea4031aa930e4a6efacc140dd483ea4
  # Sidecar de credenciales (feature 011). Digest de partida el de develop; el CI
  # de release lo reemplaza como a los demas.
  - name: ghcr.io/jormancopete/ingenia365erp/credential-helper
    digest: sha256:0b8ddc8c47a7e7b4b9db80617b155569fa9ce05cbe146900b14935c2867caee5
patches:
  # Dos replicas de API y Web: un pod puede morir sin cortar el servicio.
  # (La Web no tiene circuitos Blazor Server, asi que no necesita afinidad.)
  - target: {kind: Deployment, name: erp-api}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  # 2 GiB (2026-11-06, autorizado por el dueno): con 1 GiB los dos pods cayeron
  # por OOMKilled al aplicar una plantilla de 11.949 personas, y en reposo ya
  # rondaban los 800 MiB. Por nombre de contenedor, no por posicion: el
  # componente de adjuntos agrega un sidecar. La cuota de disponibilidad.yaml
  # sube a la par: sin eso el pod excedente de cada actualizacion no se crea.
  - target: {kind: Deployment, name: erp-api}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: erp-api
      spec:
        template:
          spec:
            containers:
              - name: api
                resources:
                  limits:
                    memory: 2Gi
  - target: {kind: Deployment, name: erp-web}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
