# Trabajo de migracion previo al despliegue (Argo CD PreSync hook).
#
# Por que existe: en produccion Database__AutoMigrate=false, asi que la API se
# NIEGA a arrancar si hay migraciones pendientes (fail-fast, decision de diseno).
# Este Job las aplica ANTES de rotar los pods, con dos garantias:
#   - Corre una sola vez por sincronizacion, antes que cualquier pod nuevo.
#   - El DbMigrator toma un lock nativo (pg_advisory_lock), asi que aunque se
#     ejecutara dos veces en paralelo, solo una aplica el esquema.
# Si el Job falla, Argo CD ABORTA la sincronizacion y los pods viejos siguen
# sirviendo con el esquema viejo: no hay ventana de incompatibilidad.
apiVersion: batch/v1
kind: Job
metadata:
  # generateName y NO name, y sin hook-delete-policy: BeforeHookCreation.
  #
  # Con nombre fijo y BeforeHookCreation, Argo CD 3.5.0 tiene que borrar el Job
  # de la sincronizacion anterior antes de crear el nuevo, y mientras ese Job
  # exista (lo conservamos 24 h por ttlSecondsAfterFinished) la operacion pasa a
  # "waiting for deletion of hook batch/Job/erp-db-migrate" y en el mismo
  # segundo termina Succeeded SIN ejecutar el hook ni aplicar nada. Visto tres
  # veces el 2026-09-10 en produccion (18:17, 21:07): la primera sincronizacion
  # tras otra reciente no desplegaba, la segunda si. La primera del dia (16:03)
  # funcionaba porque el Job del dia anterior ya habia vencido su TTL.
  #
  # Con generateName cada sincronizacion crea un Job con nombre propio, no hay
  # nada que borrar antes, y los anteriores se van solos a las 24 h. Para leer
  # los logs: kubectl -n erp-pdn logs -l app.kubernetes.io/name=erp-db-migrate
  #
  # El name fijo sigue porque kustomize lo exige para acumular el recurso
  # ("missing metadata.name"); Argo CD, al ver generateName en un hook, acuña el
  # nombre unico (generateName + revision + fase + marca de tiempo) y no usa este.
  name: erp-db-migrate
  generateName: erp-db-migrate-
  annotations:
    argocd.argoproj.io/hook: PreSync
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400   # conserva los logs 24 h para diagnostico; tambien limpia los Jobs viejos
  template:
    metadata:
      labels: { app.kubernetes.io/name: erp-db-migrate }
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      # DOS PASOS, y no "--scope all", que es lo que habia aqui.
      #
      # "all" hace tres cosas: base administrativa, base operativa, y despues
      # recorre las cooperativas llamando a TenantSchemaService — un esquema por
      # cooperativa DENTRO de la base operativa. Ese es el modelo ANTERIOR: el
      # vivo es una base por cooperativa (Principio IV, el aislamiento es
      # fisico). Con cooperativas registradas habria creado sus ~289 tablas como
      # esquemas dentro de la plantilla, y eso se descubre semanas despues.
      #
      # Hoy no ha hecho dano porque produccion tiene CERO cooperativas
      # (verificado). Era una mina para la primera que se registre.
      #
      # El migrador ya se niega a hacerlo (sale con codigo 2 y
      # [Migrator.ModeloDeAislamiento]), pero eso abortaria la sincronizacion:
      # mejor invocarlo bien.
      #
      # PENDIENTE, y conviene que este escrito: las bases de cada cooperativa no
      # las migra NADIE en produccion. La API si lo hace, pero solo con
      # AutoMigrate=true, y aqui esta en false a proposito. Hace falta un paso
      # por cooperativa apuntando la cadena operativa a SU base. Con cero
      # cooperativas no urge; con la primera, si.
      initContainers:
        # 1) Base administrativa. Aqui viaja el traslado de secretos MFA.
        - name: migrator-admin
          image: ghcr.io/jormancopete/ingenia365erp/migrator:release   # el overlay fija el digest
          imagePullPolicy: Always
          args: ["migrate", "--scope", "admin"]
          # Mismo bloque que el contenedor principal. Las credenciales salen del
          # Secret que genera CloudNativePG, asi que no pueden venir de un
          # ConfigMap compartido; duplicarlo es el precio de no inventar una
          # indireccion.
          env:
            - name: DOTNET_ENVIRONMENT
              value: Production
            - name: Database__Provider
              value: PostgreSQL
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: erp-db-app, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: erp-db-app, key: password } }
            - name: Database__ConnectionStrings__PostgreSQL
              value: "Host=erp-db-rw;Port=5432;Database=ingenia365erp;Username=$(DB_USER);Password=$(DB_PASSWORD);SSL Mode=Require;Trust Server Certificate=true"
            - name: Database__AdminConnectionStrings__PostgreSQL
              value: "Host=erp-db-rw;Port=5432;Database=ingenia365erp_admin;Username=$(DB_USER);Password=$(DB_PASSWORD);SSL Mode=Require;Trust Server Certificate=true"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        # 2) Base operativa (la plantilla). El --tenant con un identificador que
        #    no existe neutraliza el bucle de cooperativas: el filtro salta toda
        #    cooperativa que no coincida, y ninguna se llama asi.
        - name: migrator
          image: ghcr.io/jormancopete/ingenia365erp/migrator:release   # el overlay fija el digest
          imagePullPolicy: Always
          args: ["migrate", "--scope", "tenants", "--tenant", "__ninguna__"]
          env:
            - name: DOTNET_ENVIRONMENT
              value: Production
            - name: Database__Provider
              value: PostgreSQL
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: erp-db-app, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: erp-db-app, key: password } }
            - name: Database__ConnectionStrings__PostgreSQL
              value: "Host=erp-db-rw;Port=5432;Database=ingenia365erp;Username=$(DB_USER);Password=$(DB_PASSWORD);SSL Mode=Require;Trust Server Certificate=true"
            - name: Database__AdminConnectionStrings__PostgreSQL
              value: "Host=erp-db-rw;Port=5432;Database=ingenia365erp_admin;Username=$(DB_USER);Password=$(DB_PASSWORD);SSL Mode=Require;Trust Server Certificate=true"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
