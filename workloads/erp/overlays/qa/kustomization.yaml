apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: erp-qa
resources:
  - ../../base
# QA: se auto-migra (para probar que las migraciones aplican limpio) y lleva
# datos demo para certificacion funcional. Es el ensayo general de produccion.
configMapGenerator:
  - name: erp-config
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=QA
      - Database__AutoMigrate=true
      - Database__Seed__RunParametricSeed=true
      - Database__Seed__RunTestSeed=true
      # Las dos claves EmailSender__* que habia aqui NO las leia ningun codigo:
      # la seccion se llama IdentityEmail (IdentityEmailOptions.SectionName), y
      # sin ella regia el valor cableado https://localhost:7200. O sea que TODOS
      # los enlaces de TODOS los correos apuntaban a localhost.
      - IdentityEmail__BaseUrl=https://app-qa.ingenia365.com
      # Obligatorias desde el rediseno del segundo factor: WebAuthnOptions se
      # valida con ValidateOnStart y NO tiene valores por defecto, asi que sin
      # estas dos el proceso muere al arrancar y el rollout queda colgado.
      # RelyingPartyId es el dominio RAIZ y vale para los tres ambientes.
      # CAMBIARLO invalida todas las passkeys ya inscritas, sin migracion.
      - WebAuthn__RelyingPartyId=ingenia365.com
      - WebAuthn__OrigenesPermitidos__0=https://app-qa.ingenia365.com
      # Correo saliente. Sin esto NADA que dependa del correo funciona en QA:
      # ni la invitacion del primer administrador al registrar una cooperativa
      # (el token viaja solo en el correo; en la base queda el hash, asi que
      # si no sale se pierde), ni el restablecimiento de contrasena, ni la
      # recuperacion del segundo factor. Antes no habia ninguna clave Smtp__ y
      # regia localhost:25, o sea que todo fallaba en silencio.
      # Usuario y contrasena NO van aqui: van en el Secret erp-smtp (ver
      # tools/scripts/crear-secreto-smtp.ps1 en el repo del ERP).
      - Smtp__Host=mail.notifica365.com
      - Smtp__Port=587
      - Smtp__UseStartTls=true
      - Smtp__FromAddress=noresponder.ingenia365erp@notifica365.com
      - Smtp__FromName=No Responder IngenIA365 ERP
      # PARCHE, no secreto: es el hash publico del certificado autofirmado de
      # fabrica de Poste.io que presenta mail.notifica365.com. Sin fijarlo,
      # MailKit rechaza la conexion. Cuando el servidor tenga un certificado
      # valido, borrar esta linea.
      - Smtp__HuellaCertificadoAceptada=54EA10957D7018ADE475CA084C1CADD14030D460CD6EED62F7CEDCDA15974E1C
# Imagenes por DIGEST, no por etiqueta (P3, cerrado el 2026-09-10).
#
# Estas lineas las escribe el CI del repositorio de la aplicacion (job "gitops"
# de .github/workflows/ci.yml) cada vez que publica imagenes desde la rama que
# alimenta este ambiente. No editarlas a mano salvo para volver a una version
# anterior: cambiar el digest ES el despliegue, y Argo CD lo ve como un cambio
# real del manifiesto, que es lo que la etiqueta movil nunca fue.
#
# Con la etiqueta (:develop, :release) pasaba esto: se republicaba la imagen, el
# manifiesto no cambiaba, Argo decia Synced y los pods seguian con la imagen
# vieja hasta que alguien hacia rollout restart. Tres veces en produccion.
images:
  - name: ghcr.io/jormancopete/ingenia365erp/api
    digest: sha256:d688d7a9bdc5163ab34315b02c8110569fc288bd40555adaffd8ff6231d82063
  - name: ghcr.io/jormancopete/ingenia365erp/web
    digest: sha256:f153df7b07a4e968720e1ad90c9a9b7f661ab306c11ad92e28e4c8a71c92c471
patches:
  - target: {kind: StatefulSet, name: erp-mongo}
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 5Gi
  # El IngressRoute de base no filtra por Host, y en PDN no hace falta: a ese
  # Traefik solo le llega un hostname. Aqui NO: DEV y QA comparten el Traefik
  # de nonprod, asi que dos rutas PathPrefix(`/`) con la misma prioridad se
  # pisan y todo el trafico de los DOS hostnames acaba en un solo namespace.
  # Sin Host() el sintoma es que uno de los dos ambientes sirve al otro.
  - target: {group: traefik.io, version: v1alpha1, kind: IngressRoute, name: erp}
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`app-qa.ingenia365.com`) && (PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/hubs`) || PathPrefix(`/swagger`))
      - op: replace
        path: /spec/routes/1/match
        value: Host(`app-qa.ingenia365.com`) && PathPrefix(`/`)
