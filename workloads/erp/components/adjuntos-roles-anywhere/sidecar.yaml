apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-api
spec:
  template:
    spec:
      initContainers:
        # Sidecar NATIVO (initContainer con restartPolicy Always, Kubernetes >= 1.29;
        # los clusteres van en 1.36): arranca ANTES que la API, y el binario escucha
        # en milisegundos, mucho antes de que la API termine de arrancar y haga su
        # primera sonda del almacen.
        - name: credenciales-adjuntos
          image: ghcr.io/jormancopete/ingenia365erp/credential-helper:develop   # el overlay fija el DIGEST
          restartPolicy: Always
          args:
            - serve
            - --certificate=/certificado/tls.crt
            - --private-key=/certificado/tls.key
            - --trust-anchor-arn=$(TRUST_ANCHOR_ARN)
            - --profile-arn=$(PROFILE_ARN)
            - --role-arn=$(ROLE_ARN)
            - --port=9911
            # TTL 1: la respuesta no sale del pod (como el hop limit de IMDSv2 en EC2).
            - --hop-limit=1
          env:
            - name: TRUST_ANCHOR_ARN
              valueFrom: { configMapKeyRef: { name: erp-roles-anywhere, key: trustAnchorArn } }
            - name: PROFILE_ARN
              valueFrom: { configMapKeyRef: { name: erp-roles-anywhere, key: profileArn } }
            - name: ROLE_ARN
              valueFrom: { configMapKeyRef: { name: erp-roles-anywhere, key: roleArn } }
          # SIN sondas, a proposito: aws_signing_helper serve escucha SOLO en
          # 127.0.0.1 (esta fijo en su codigo) y el kubelet sondea la IP del pod,
          # asi que un tcpSocket nunca pasa y mata al sidecar en bucle (le paso al
          # primer despliegue, 2026-09-23). La imagen es distroless: no hay con que
          # hacer un exec. Lo que si prueba que la credencial sirve es la sonda
          # /health/ready de la API, que escribe y borra un objeto en el bucket.
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 200m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          # El certificado y su llave se montan SOLO aqui: el proceso de la API
          # nunca los ve (research R3).
          # Se montan 0400 y la imagen corre sin privilegios: los puede leer por el
          # fsGroup 10001 del pod (base/api.yaml). Sin el, "could not parse PEM data".
          volumeMounts:
            - { name: certificado-adjuntos, mountPath: /certificado, readOnly: true }
      containers:
        - name: api
          env:
            # Sin barra final: algunos SDK la rechazan.
            - name: AWS_EC2_METADATA_SERVICE_ENDPOINT
              value: http://127.0.0.1:9911
      volumes:
        - name: certificado-adjuntos
          secret: { secretName: erp-adjuntos-certificado, defaultMode: 0400 }
