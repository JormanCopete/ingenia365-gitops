# Keycloak de Conecta (ADR-004), servido bajo /auth en el mismo host que el dashboard y la API: sin CORS y una sola
# imagen del dashboard para todos los ambientes.
#
# El realm se importa en el primer arranque desde keycloak/realm-conecta.json, que genera
# tools/k8s/realm-for-cluster.py del repo de Conecta: sin el usuario de desarrollo y con los secretos de los clientes
# confidenciales como ${KC_SECRET_*}, que Keycloak resuelve de las variables del Secret conecta-keycloak-clients.
# Si el realm ya existe, --import-realm no lo toca: los cambios posteriores se hacen por la consola o la Admin API.
#
# La consola de administración NO se publica (la ruta solo deja pasar /auth/realms y /auth/resources). Para entrar:
#   k3s kubectl -n conecta-qa port-forward deploy/conecta-keycloak 8080:8080   ->  http://localhost:8080/auth/admin
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conecta-keycloak
  labels: { app.kubernetes.io/name: conecta-keycloak }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: conecta-keycloak }
  template:
    metadata:
      labels: { app.kubernetes.io/name: conecta-keycloak }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.3
          args:
            - start
            - --import-realm
            - --http-enabled=true
            - --http-port=8080
            - --http-relative-path=/auth
            - --hostname=$(CONECTA_PUBLIC_URL)/auth
            # La API lee los metadatos y las claves por la red interna (http://conecta-keycloak:8080/auth).
            - --hostname-backchannel-dynamic=true
            - --proxy-headers=xforwarded
            - --health-enabled=true
            - --metrics-enabled=true
          env:
            - name: CONECTA_PUBLIC_URL
              valueFrom: { configMapKeyRef: { name: conecta-env, key: CONECTA_PUBLIC_URL } }
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://conecta-db-rw:5432/keycloak" }
            - name: KC_DB_USERNAME
              valueFrom: { secretKeyRef: { name: conecta-db-keycloak, key: username } }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: conecta-db-keycloak, key: password } }
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: conecta-keycloak-admin, key: username } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: conecta-keycloak-admin, key: password } }
            - { name: KC_DB_POOL_MAX_SIZE, value: "10" }
            - { name: JAVA_OPTS_KC_HEAP, value: "-XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=30" }
            - { name: TZ, value: America/Bogota }
          envFrom:
            - secretRef: { name: conecta-keycloak-clients }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          startupProbe:
            httpGet: { path: /auth/health/started, port: management }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /auth/health/ready, port: management }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /auth/health/live, port: management }
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { memory: 768Mi }
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: realm
          configMap: { name: conecta-keycloak-realm }
---
apiVersion: v1
kind: Service
metadata:
  name: conecta-keycloak
spec:
  selector: { app.kubernetes.io/name: conecta-keycloak }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: management, port: 9000, targetPort: management }
