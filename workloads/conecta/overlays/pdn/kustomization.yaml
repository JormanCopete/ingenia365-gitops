apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: conecta-pdn
resources:
  - ../../base
  - almacenamiento.yaml
  - respaldo.yaml
# SIN el componente vault-unseal-nonprod: en producción el sello de Vault lo abre una persona con
# tools/k8s/bootstrap.sh unseal (repo de Conecta). Tras un reinicio del nodo la firma queda detenida hasta entonces.
configMapGenerator:
  - name: conecta-env
    literals:
      - CONECTA_PUBLIC_URL=https://conecta.ingenia365.com
      - ASPNETCORE_ENVIRONMENT=Production
      # governance HASTA LA HABILITACIÓN: lo de prueba se puede limpiar con s3:BypassGovernanceRetention. Al emitir
      # documentos reales se cambia a compliance (decisión del 2026-11-25).
      - CUSTODY_LOCK_MODE=governance
  - name: conecta-config
    behavior: merge
    literals:
      # NIT real de IngenIA365 SAS (INNOVACIONES TECNOLOGICAS Y FINANCIERAS S.A.S., DV 4), según el RUT; 2026-11-26.
      - Rendering__Manufacturer__Nit=901691159
# Imágenes por DIGEST. Producción NO las recibe del CI: se fijan a mano. Estos son los de la versión v0.1.0
# (workflow Release, firmadas con cosign y con SBOM; develop a8092ee). Revertir el commit vuelve a la anterior.
images:
  - name: ghcr.io/jormancopete/conecta-api
    digest: sha256:e0efc9e453ff54ef59e2ec1e42ad748cf02579595a05b5a5cc8b841b04801dc1
  - name: ghcr.io/jormancopete/conecta-workers
    digest: sha256:6d01d068d68e6d599d2ca2ef185f20132c37b52f87a6a9c824c6dc838026b34c
  - name: ghcr.io/jormancopete/conecta-dashboard
    digest: sha256:e8726dca2078dba975b13d3489e779d2033a6881bfcc6e14f836dded67086405
  - name: ghcr.io/jormancopete/conecta-migrator
    digest: sha256:eb4e2c2500dd09bc4b54942e9248c889b4b8a629491a3a615646483a770dfe1d
patches:
  # Discos que sobreviven al borrado del PVC: la custodia y las claves no se pueden perder por un error de Argo.
  - target: { kind: StatefulSet, name: conecta-silo }
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: conecta-retain
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 15Gi
  - target: { kind: StatefulSet, name: conecta-vault }
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: conecta-retain
  - target: { group: postgresql.cnpg.io, kind: Cluster, name: conecta-db }
    path: db-pdn.yaml
  # Migraciones ANTES de rotar los pods, como erp-db-migrate: si fallan, Argo aborta y los pods viejos siguen con el
  # esquema viejo. En la primera sincronización no se podía (la base aún no existía); desde el 2026-11-26 ya existe.
  - target: { kind: Job, name: conecta-migrate }
    patch: |-
      - op: replace
        path: /metadata/annotations/argocd.argoproj.io~1hook
        value: PreSync
  # En PDN el mismo Traefik recibe app.ingenia365.com, cuyas rutas del ERP no llevan Host() y tienen prioridad 100 y 1.
  # Las de Conecta van con Host() y prioridad mayor para que el ERP nunca las tape.
  - target: { group: traefik.io, version: v1alpha1, kind: IngressRoute, name: conecta }
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`conecta.ingenia365.com`) && (PathPrefix(`/v1`) || PathPrefix(`/health`))
      - op: replace
        path: /spec/routes/0/priority
        value: 300
      - op: replace
        path: /spec/routes/1/match
        value: Host(`conecta.ingenia365.com`) && (PathPrefix(`/auth/realms`) || PathPrefix(`/auth/resources`))
      - op: replace
        path: /spec/routes/1/priority
        value: 290
      - op: replace
        path: /spec/routes/2/match
        value: Host(`conecta.ingenia365.com`) && PathPrefix(`/`)
      - op: replace
        path: /spec/routes/2/priority
        value: 200
