apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: erp-dev
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: git@github.com:JormanCopete/ingenia365-gitops.git
    targetRevision: main
    path: workloads/erp/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: erp-dev
  syncPolicy:
    # DEV: totalmente automatico. Un merge llega solo; si alguien toca el
    # cluster a mano, selfHeal lo revierte al estado de Git.
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=false, ServerSideApply=true]
  # volumeClaimTemplates es INMUTABLE en un StatefulSet y Kubernetes le inyecta
  # campos propios (status, creationTimestamp) que el manifiesto no declara. Sin
  # esta excepcion, la aplicacion queda OutOfSync de forma PERMANENTE: se
  # comprobo que `argocd app diff` sale limpio y que el apply es exitoso
  # (serverside-applied) y aun asi el estado no cambiaba.
  #
  # No es "ignorar un problema": una diferencia ahi NO ES ACCIONABLE, porque
  # Kubernetes no permite modificar ese bloque. Lo peligroso es lo contrario —
  # una aplicacion siempre en OutOfSync ensena al equipo a ignorar justo la
  # senal que debe avisar de una deriva real en produccion.
  #
  # Cambiar el tamano del volumen sigue exigiendo recrear el StatefulSet a mano.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers: ["/spec/volumeClaimTemplates"]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: erp-qa
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: git@github.com:JormanCopete/ingenia365-gitops.git
    targetRevision: main
    path: workloads/erp/overlays/qa
  destination:
    server: https://kubernetes.default.svc
    namespace: erp-qa
  syncPolicy:
    # QA: automatico pero SIN selfHeal, para poder congelar un estado durante
    # una certificacion sin que Argo lo revierta.
    automated: { prune: true, selfHeal: false }
    syncOptions: [CreateNamespace=false, ServerSideApply=true]
  # volumeClaimTemplates es INMUTABLE en un StatefulSet y Kubernetes le inyecta
  # campos propios (status, creationTimestamp) que el manifiesto no declara. Sin
  # esta excepcion, la aplicacion queda OutOfSync de forma PERMANENTE: se
  # comprobo que `argocd app diff` sale limpio y que el apply es exitoso
  # (serverside-applied) y aun asi el estado no cambiaba.
  #
  # No es "ignorar un problema": una diferencia ahi NO ES ACCIONABLE, porque
  # Kubernetes no permite modificar ese bloque. Lo peligroso es lo contrario —
  # una aplicacion siempre en OutOfSync ensena al equipo a ignorar justo la
  # senal que debe avisar de una deriva real en produccion.
  #
  # Cambiar el tamano del volumen sigue exigiendo recrear el StatefulSet a mano.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers: ["/spec/volumeClaimTemplates"]
