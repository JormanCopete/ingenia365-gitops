apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: panel
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:JormanCopete/ingenia365-gitops.git
    targetRevision: main
    path: workloads/panel
  destination:
    server: https://kubernetes.default.svc
    namespace: panel
  syncPolicy:
    # Mismo criterio que erp-pdn: en el nodo de producción nada se despliega solo.
    automated: null
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
